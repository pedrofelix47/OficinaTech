{% extends "admin/change_form.html" %}
{% load i18n %}

{# Insert a Back button above the change form content. Uses back_url if provided, otherwise history.back() #}
{% block content %}
  <div style="margin-bottom: 12px; display:flex; justify-content:flex-start; gap:8px;">
    <a class="button" href="{% if back_url %}{{ back_url }}{% else %}javascript:history.back(){% endif %}" style="background:#f3f4f6; color:#111827; border:1px solid #e5e7eb; padding:6px 10px; border-radius:6px; text-decoration:none;">
      {% trans "Voltar" %}
    </a>
  </div>
  {{ block.super }}
{% endblock %}
