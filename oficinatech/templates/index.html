<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oficinas Tech - Login</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <!-- <link rel="stylesheet" href="static/style.css"> -->
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

    <div class="d-flex align-items-center justify-content-center min-vh-100 bg-light-custom">
        <div class="login-card p-5 bg-white rounded-3 shadow-sm mx-3">
            <div class="text-center mb-4 pb-2">
                <h2 class="text-primary-custom fw-medium mb-2 fs-3">Oficinas Tech</h2>
                <p class="text-muted-custom mb-0">Sistema de Gestão de Estoque</p>
                {{dev}}
            </div>

            <form method="POST" action="{% url 'login' %}" id="loginForm">
                {% csrf_token %} {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-danger">{{ message }}</div>
                    {% endfor %}
                {% endif %}    
                
                <div class="mb-3">
                    <label for="emailInput" class="form-label fw-medium">E-mail</label>
                    <input type="email" class="form-control custom-input" id="emailInput" placeholder="seu@email.com" required>
                </div>
                <div class="mb-4">
                    <label for="passwordInput" class="form-label fw-medium">Senha</label>
                    <input type="password" class="form-control custom-input" id="passwordInput" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary-custom w-100 py-2 rounded-3 fw-medium">Entrar</button>
            </form>
        </div>

    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="{% static 'js/script.js' %}"></script>
</body>
</html>
